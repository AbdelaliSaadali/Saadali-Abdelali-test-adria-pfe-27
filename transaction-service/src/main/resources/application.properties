spring.application.name=transaction-service
server.port=8082

# Development H2 database: this module is independent of account-service
spring.datasource.url=jdbc:h2:mem:transactions_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Transaction limit; Config Server will later be the source of truth.
bank.transaction.max-amount=1000

# Direct Feign URL for development; remove the property when Eureka is active.
spring.cloud.openfeign.client.config.account-service.url=http://localhost:8081
spring.cloud.openfeign.client.config.account-service.connectTimeout=2000
spring.cloud.openfeign.client.config.account-service.readTimeout=3000
spring.cloud.openfeign.circuitbreaker.enabled=true

# No silent fallback to a fictitious account or fake success.
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
