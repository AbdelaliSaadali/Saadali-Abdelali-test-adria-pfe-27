spring.application.name=transaction-service
server.port=8082

# Development H2 database: this module is independent of account-service
spring.datasource.url=jdbc:h2:mem:transactions_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Load transaction rules from Config Server; remain runnable without it for local tests.
spring.config.import=optional:configserver:http://localhost:8888

# Feign discovers account-service by name via Eureka + LoadBalancer.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.openfeign.client.config.account-service.connectTimeout=2000
spring.cloud.openfeign.client.config.account-service.readTimeout=3000
spring.cloud.openfeign.circuitbreaker.enabled=true

# No silent fallback to a fictitious account or fake success.
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s

# GraphQL / embedded GraphiQL UI
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true

# Local-only MCP endpoint (lock down before public deployment)
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
