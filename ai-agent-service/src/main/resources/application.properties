spring.application.name=ai-agent-service
server.port=8084
# Local development only; protect the agent and upstream MCP servers before deployment.
server.address=127.0.0.1

# Key comes from the environment, never from Git. Placeholder permits startup
# and MCP discovery without paid model access; /agent/chat returns 503 until set.
spring.ai.openai.api-key=${OPENAI_API_KEY:NOT_CONFIGURED}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Connect directly to the existing read-only MCP endpoints.
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=adria-banking-agent
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=10s
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.streamable-http.connections.accounts.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.accounts.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.transactions.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.transactions.endpoint=/mcp

management.endpoints.web.exposure.include=health,info
