spring.application.name=config-service
server.port=8888

# Local native repository for the assessment: run Maven from the test_adria root.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo/,file:../config-repo/

# Keep the configuration server on localhost while authorization is not configured.
server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info
