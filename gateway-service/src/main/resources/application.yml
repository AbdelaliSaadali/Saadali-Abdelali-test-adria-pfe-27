spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Preserve /accounts/** for the Account-Service API.
            - id: account-rest
              uri: lb://account-service
              predicates:
                - Path=/api/accounts,/api/accounts/**
              filters:
                - StripPrefix=1

            # Preserve /transactions/** for Transaction-Service.
            - id: transaction-rest
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions,/api/transactions/**
              filters:
                - StripPrefix=1

            # Separate GraphQL URLs: each service owns its own schema.
            - id: account-graphql
              uri: lb://account-service
              predicates:
                - Path=/api/account-graphql
              filters:
                - SetPath=/graphql

            - id: transaction-graphql
              uri: lb://transaction-service
              predicates:
                - Path=/api/transaction-graphql
              filters:
                - SetPath=/graphql

server:
  port: 8080
  # Local development only: enable remote access after Keycloak security.
  address: 127.0.0.1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
